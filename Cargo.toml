[package]
name = "anomalies-trading-engine"
version = "2.1.0"
edition = "2021"
authors = ["Quantitative Trading Systems"]
description = "Autonomous mean-reversion trading engine with adaptive Kalman filter, exact Decimal financial invariants, and reconciled broker execution"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4"] }
rust_decimal = { version = "1.36", features = ["serde"] }
async-trait = "0.1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
